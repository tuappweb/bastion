  <title>Bastión · Duelo de castillos</title>
  <!-- Ícono de la app: un castillo dorado sobre fondo pizarra.
       - Android (Chrome) toma el ícono del manifest (icon-192.png / icon-512.png): son "maskable", a sangre y sin
         transparencia, para que Android lo recorte en círculo o cuadro redondeado sin dejar borde blanco.
       - iPhone e iPad toman el "apple-touch-icon" (180 px, sin transparencia: iOS le pone las esquinas redondeadas).
       - Los navegadores de computador usan los PNG pequeños (32 y 64 px) en la pestaña.
       "apple-mobile-web-app-title" es el nombre corto que iPhone escribe bajo el ícono. -->
  <meta name="apple-mobile-web-app-title" content="Bastión">
  <!-- Abrir como app desde el acceso directo (sin barra del navegador).

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Dirección oficial y vista previa al compartir el link (WhatsApp, Telegram, etc.).

  <style>
    :root { --fondo: #1C2129; --oro: #F0CF7D; color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      /* Mismo color que la mesa de Bastión, también detrás de la muesca y la barra de gestos */
      background: var(--fondo);
    }
    #contenedorIframe {
      position: fixed;
      /* Deja libre la muesca, la barra de estado y la barra de gestos (en computador valen 0) */
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      background: var(--fondo);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Pantalla de inicio: se ve mientras Apps Script carga el juego (la primera vez tarda unos segundos) */
    #inicio {
      position: fixed; inset: 0; z-index: 20;
      display: grid; place-items: center; align-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 45%, #2B3442 0%, var(--fondo) 70%);
      color: #E8E2D6;
      font-family: Georgia, 'Times New Roman', serif;
      transition: opacity .35s ease;
    }
    #inicio.oculto { opacity: 0; pointer-events: none; }
    #inicio .tarda { display: none; max-width: 300px; text-align: center; font-size: 15px; line-height: 1.45; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    #inicio.lento .tarda { display: block; }
    #inicio .tarda a, #inicio .tarda button {
      display: inline-block; margin: 10px 6px 0; padding: 10px 18px; border-radius: 999px; border: 0;
      background: var(--oro); color: #1D1406; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    #inicio .tarda button { background: transparent; color: inherit; box-shadow: inset 0 0 0 2px rgba(240, 207, 125, .45); }
    #inicio img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
    #inicio p { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: .04em; color: var(--oro); font-variant: small-caps; }
    #inicio .lema { font-size: 15px; letter-spacing: 0; color: #9AA3B2; font-variant: normal; font-weight: 400; margin-top: -10px; }
    #inicio .girando {
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid rgba(240, 207, 125, .15); border-top-color: var(--oro);
      animation: girar .8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #inicio .girando { animation-duration: 2.4s; } #inicio { transition: none; } }
    /* Samsung Internet respeta el diseño oscuro propio solo si la página responde a prefers-color-scheme */
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; } html, body, #contenedorIframe { background: var(--fondo); } }
  </style>
</head>
<body>

  <div id="contenedorIframe">
    <iframe
      id="miIframe"
      title="Bastión"
      allowfullscreen
      allow="fullscreen; clipboard-write; web-share"
    ></iframe>

    <p class="lema">Duelo de castillos</p>
    <div class="girando" aria-hidden="true"></div>
    <div class="tarda">
      Está tardando más de lo normal.
      <br>
      <a id="abrirDirecto" target="_top" rel="noopener">Abrir directamente</a>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </div>

  <script>
    // Dirección de la app web de Apps Script de Bastión (termina en /exec)
    const URL_APP = 'https://script.google.com/macros/s/AKfycbzBD0I9wFrWGAxyG-2nPgCJ1hMIf96n8eo15IMW05Hjtn69D7_RUN6FTgQrAa1dK7LbHQ/exec';

    // Se le pasan al juego:
    //   app=1      avisa que corre dentro de este contenedor (activa el guardado de sesión de abajo)
    //   base=…     la dirección de esta página, para que los links que comparte el juego apunten aquí
    //   partida=…  código de una partida online (link de invitación)
    //   mazo=…     código de un mazo compartido (BST-XXXXX)
    (function () {
      const q = new URLSearchParams(location.search);
      const params = new URLSearchParams();
      params.set('app', '1');
      params.set('base', location.origin + location.pathname);
      const partida = (q.get('partida') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5);
      const mazo = (q.get('mazo') || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 12);
      if (partida) params.set('partida', partida);
      if (mazo) params.set('mazo', mazo);
      document.getElementById('miIframe').src = URL_APP + '?' + params.toString();
      // Los códigos se borran de la barra de direcciones para que no se repitan al recargar.
      if ((partida || mazo) && history.replaceState) history.replaceState(null, '', location.pathname);
    })();

    // Solo se atienden mensajes del juego de Apps Script (origen *.googleusercontent.com).
    function esDelJuego(ev, aceptarNull) {
      try { return (aceptarNull && ev.origin === 'null') || /\.googleusercontent\.com$/.test(new URL(ev.origin).hostname); }
      catch (e) { return false; }
    }

    // ---- Pantalla de inicio (va primero: aunque algo de más abajo falle, siempre se quita) ----
    // Se quita cuando el juego avisa que está listo, o 4 s después de que cargue el iframe.
    // Si a los 10 s sigue cargando, ofrece abrir el juego directo en Google.
    const inicio = document.getElementById('inicio');
    function quitarInicio() {
      if (!inicio || inicio.classList.contains('oculto')) return;
      inicio.classList.add('oculto');
      setTimeout(() => inicio.remove(), 400);
    }
    window.addEventListener('message', ev => {
      if (ev.data && ev.data.tipo === 'bastion-lista') quitarInicio();
    });
    document.getElementById('miIframe').addEventListener('load', () => setTimeout(quitarInicio, 4000));
    const abrirDirecto = document.getElementById('abrirDirecto');
    if (abrirDirecto) abrirDirecto.href = URL_APP;
    setTimeout(() => { if (inicio) inicio.classList.add('lento'); }, 10000);
    setTimeout(quitarInicio, 25000);   // último recurso: nunca queda tapando el juego para siempre


    // ---- Datos del juego guardados aquí (necesario en iPhone) ----
    // Safari aísla y borra lo que guarda el juego dentro del iframe de Google; esta página sí lo conserva.
    // Se guardan solo las claves del juego (empiezan con "ldr_"): identificador del jugador, sesión,
    // nombre, mazo elegido, partida online en curso y partida contra la máquina en curso.
    const CLAVE_OK = k => typeof k === 'string' && /^ldr_[a-z]{2,10}$/.test(k);
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (!d || (d.tipo !== 'bastion-pedir' && d.tipo !== 'bastion-guardar')) return;
      if (!esDelJuego(ev, false)) return;
      if (d.tipo === 'bastion-guardar') {
        if (!CLAVE_OK(d.k)) return;
        try {
          if (d.v == null) localStorage.removeItem(d.k);
          else if (typeof d.v === 'string' && d.v.length <= 400000) localStorage.setItem(d.k, d.v);
        } catch (e) {}
        return;
      }
      const datos = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (CLAVE_OK(k)) datos[k] = localStorage.getItem(k);
        }
      } catch (e) {}
      try { ev.source.postMessage({ tipo: 'bastion-datos', datos }, ev.origin); } catch (e) {}
    });

    // El juego (dentro del iframe) pide abrir WhatsApp: se abre desde aquí, que es la página principal.
    // Solo se aceptan mensajes de Apps Script y solo links de WhatsApp.
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (!d || d.tipo !== 'bastion-abrir' || typeof d.url !== 'string') return;
      if (!esDelJuego(ev, true)) return;
      if (!/^https:\/\/(wa\.me|api\.whatsapp\.com)\//.test(d.url)) return;
      const w = window.open(d.url, '_blank');
      if (w) { try { w.opener = null; } catch (e) {} }
      else location.href = d.url;   // si se bloqueó la ventana nueva, se abre en esta misma
    });
  </script>
